<title>Bảng tuần hoàn hóa học</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 font-family:Arial,sans-serif;
 background:#101827;color:white
}
h1{text-align:center;color:#60d8ff}
.sub{text-align:center;color:#b9c8d9}
.search{
 display:block;width:100%;max-width:550px;
 margin:20px auto;padding:14px;
 border-radius:12px;border:2px solid #60d8ff;
 font-size:17px
}
.table{
 display:grid;
 grid-template-columns:repeat(18,minmax(48px,1fr));
 gap:5px;max-width:1300px;margin:auto;
 overflow-x:auto
}
.element{
 min-width:0;min-height:83px;
 border-radius:7px;padding:5px;
 cursor:pointer;text-align:center;
 border:1px solid #ffffff30;
 transition:.2s
}
.element:hover{transform:scale(1.08);border:2px solid white}
.num{font-size:10px;text-align:left}
.symbol{font-size:21px;font-weight:bold}
.name{font-size:9px;overflow-wrap:anywhere}
.mass{font-size:9px}
.alkali{background:#e87979;color:#241010}
.alkaline{background:#f4b46b;color:#24170a}
.transition{background:#e8d36b;color:#251f08}
.post{background:#85c9a0;color:#10251a}
.metalloid{background:#6dcac5;color:#102626}
.nonmetal{background:#75a9ed;color:#10213b}
.halogen{background:#b49ae9;color:#25163d}
.noble{background:#d98acb;color:#30102a}
.lanthanide{background:#b5a0dd;color:#211534}
.actinide{background:#9b9cce;color:#151735}
.other{background:#68798d}
.info{
 max-width:850px;margin:30px auto;
 padding:24px;background:#1d2b40;
 border-radius:15px;border:1px solid #4b6684;
 line-height:1.7
}
.info h2{color:#60d8ff}
.info h3{color:#ffd477}
.tag{display:inline-block;padding:5px 10px;
 background:#284d68;border-radius:20px;margin:3px}
button{
 padding:10px 15px;border:0;border-radius:8px;
 background:#60d8ff;cursor:pointer;font-weight:bold
}
@media(max-width:700px){
 body{padding:8px}
 .table{grid-template-columns:repeat(18,55px);overflow-x:auto}
}
</style>
</head>

const elements=raw.trim().split("\n").map(line=>{
 const [z,symbol,name,mass,group,period,type]=line.split("|");
 return {z:+z,symbol,name,mass:+mass,group:+group,
 period:+period,type};
});

const colors={
 "kim loại kiềm":"alkali",
 "kim loại kiềm thổ":"alkaline",
 "kim loại chuyển tiếp":"transition",
 "kim loại":"post",
 "á kim":"metalloid",
 "phi kim":"nonmetal",
 "halogen":"halogen",
 "khí hiếm":"noble",
 "họ Lanthanide":"lanthanide",
 "họ Actinide":"actinide"
};

const special={
 1:[1],2:[18],3:[1],4:[2],5:[13],6:[14],
 7:[15],8:[16],9:[17],10:[18],
 57:[3],58:[3],59:[3],60:[3],61:[3],
 62:[3],63:[3],64:[3],65:[3],66:[3],
 67:[3],68:[3],69:[3],70:[3],71:[3],
 89:[3],90:[3],91:[3],92:[3],93:[3],
 94:[3],95:[3],96:[3],97:[3],98:[3],
 99:[3],100:[3],101:[3],102:[3],103:[3]
};

const layoutPosition = el=>{
 if(el.z>=58 && el.z<=71)
   return {row:9,col:el.z-54};
 if(el.z>=90 && el.z<=103)
   return {row:10,col:el.z-86};
 return {row:el.period,col:el.group};
};

const table=document.getElementById("table");

elements.forEach(el=>{
 const p=layoutPosition(el);
 const div=document.createElement("div");
 div.className="element "+(colors[el.type]||"other");
 div.style.gridColumn=p.col;
 div.style.gridRow=p.row;
 div.innerHTML=`
 <div class="num">${el.z}</div>
 <div class="symbol">${el.symbol}</div>
 <div class="name">${el.name}</div>
 <div class="mass">${el.mass}</div>`;
 div.onclick=()=>showInfo(el);
 table.appendChild(div);
});

function showInfo(el){
 const neutrons=Math.round(el.mass)-el.z;
 const electrons=el.z;
 const protons=el.z;

 const configs={
 1:"1",2:"2",3:"2,1",4:"2,2",5:"2,3",
 6:"2,4",7:"2,5",8:"2,6",9:"2,7",10:"2,8",
 11:"2,8,1",12:"2,8,2",13:"2,8,3",
 14:"2,8,4",15:"2,8,5",16:"2,8,6",
 17:"2,8,7",18:"2,8,8",19:"2,8,8,1",
 20:"2,8,8,2",26:"2,8,14,2",29:"2,8,18,1",
 30:"2,8,18,2"
 };

 const shell=configs[el.z]||"Cần tra cứu cấu hình electron chi tiết";

 const info=document.getElementById("info");
 info.innerHTML=`
 <h2>${el.name} (${el.symbol})</h2>
 <span class="tag">${el.type}</span>
 <span class="tag">Nhóm ${el.group}</span>
 <span class="tag">Chu kỳ ${el.period}</span>

 <h3>1. Thông tin cơ bản</h3>
 <p>Số hiệu nguyên tử: <b>${el.z}</b></p>
 <p>Nguyên tử khối gần đúng: <b>${el.mass}</b></p>
 <p>Proton: <b>${protons}</b></p>
 <p>Electron trong nguyên tử trung hòa: <b>${electrons}</b></p>
 <p>Neutron gần đúng: <b>${neutrons}</b></p>

 <h3>2. Cấu tạo nguyên tử</h3>
 <p>Cấu hình electron theo lớp (dữ liệu rút gọn):
 <b>${shell}</b></p>
 <p>Lớp electron ngoài cùng là yếu tố quan trọng
 để dự đoán tính chất hóa học.</p>

 <h3>3. Vị trí trong bảng tuần hoàn</h3>
 <p>Chu kỳ: ${el.period}</p>
 <p>Nhóm: ${el.group}</p>
 <p>Phân loại: ${el.type}</p>

 <h3>4. Tính chất cần học</h3>
 <p><b>Tính chất vật lý:</b> Phân loại ${el.type}.
 Trạng thái và các đặc điểm vật lý cụ thể phụ thuộc
 vào nguyên tố và điều kiện nhiệt độ.</p>

 <p><b>Tính chất hóa học:</b> Phụ thuộc cấu hình
 electron, đặc biệt là electron lớp ngoài cùng.
 Cần xét các phản ứng đặc trưng của nguyên tố.</p>

 <h3>5. Kiến thức hóa học lớp 10</h3>
 <ul>
 <li>Số hiệu nguyên tử Z bằng số proton.</li>
 <li>Nguyên tử trung hòa có số electron bằng số proton.</li>
 <li>Số khối A = proton + neutron.</li>
 <li>Chu kỳ cho biết số lớp electron.</li>
 <li>Nhóm A liên quan đến số electron hóa trị
 đối với các nguyên tố nhóm chính.</li>
 <li>Độ âm điện, bán kính nguyên tử và năng lượng
 ion hóa có quy luật biến đổi tuần hoàn.</li>
 </ul>

 <p><b>Lưu ý:</b> Nguyên tử khối trung bình không nhất
 thiết là số khối của một đồng vị cụ thể.
 Số neutron ở trên chỉ là giá trị gần đúng.</p>
 `;
 info.scrollIntoView({behavior:"smooth",block:"start"});
}

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.trim().toLowerCase();
 const found=elements.find(el=>
 el.symbol.toLowerCase()===q ||
 el.name.toLowerCase().includes(q) ||
 String(el.z)===q
 );
 if(found)showInfo(found);
});
</script>
